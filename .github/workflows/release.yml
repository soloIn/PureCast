name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Native C++ Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Linux Kernel Settings for Sanitizers
        # 针对现代 Linux 内核修复 ASan 在较高虚拟内存地址随机化 (mmap_rnd_bits) 下的初始化冲突
        run: sudo sysctl vm.mmap_rnd_bits=28 || true

      - name: Configure CMake
        run: cmake -B app/src/main/cpp/tests/build -S app/src/main/cpp/tests

      - name: Build Native Tests (ASan + TSan)
        run: cmake --build app/src/main/cpp/tests/build --parallel

      - name: Run CTest
        run: ctest --test-dir app/src/main/cpp/tests/build --output-on-failure

  android-build:
    name: Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Install NDK/CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${{ runner.temp }}/purecast-release.jks"
          fi

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APKs (Split by ABI + Universal)
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && format('{0}/purecast-release.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APKs (arm64-v8a, armeabi-v7a, universal)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: PureCast-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Unit Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Upload APKs to GitHub Release
    if: github.event_name == 'release'
    needs: [ native-tests, android-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks/
          merge-multiple: true

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
